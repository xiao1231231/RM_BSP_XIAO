# ═══════════════════════════════════════════════════════════════════════════
#  RM_F407 烧录 / 调试配置（SEGGER J-Link，OpenOCD 版）
#
#  ★ 日常不要用这个文件 ★
#  OpenOCD 的 jlink 驱动只能通过 WinUSB 访问 J-Link，而本机 J-Link 绑定的是
#  SEGGER 官方驱动（JLink.exe / RTT Viewer / Ozone 都依赖它）。两者互斥：
#    - 保留 SEGGER 驱动  -> 用 CLion 原生 "SEGGER J-Link" Debug Profile（推荐）
#    - 用 Zadig 换 WinUSB -> 本文件才能用，但 SEGGER 工具会识别不到 J-Link
#
#  本文件仅作为“已切到 WinUSB 驱动”时的备用配置保留。
#
#  用法（在工程根目录 D:\RM_XIAO\RM_F407 下）：
#    openocd -f User_Config/openocd_jlink.cfg ^
#            -c "program build/Debug/RM_F407.elf verify reset exit"
#
#  前提：Windows 已安装 J-Link 驱动（本机已装 jlinkwinusb.inf）。
#        OpenOCD 通过 libusb 直接访问 J-Link，不需要启动 JLinkGDBServer，
#        也不需要完整的 J-Link 软件包。
#        若报 "unable to find a matching J-Link device"：
#          ① 确认 J-Link 已插好、设备管理器里没有黄色感叹号；
#          ② 换一根短一点、带屏蔽的 USB 线；
#          ③ 用 JLink.exe（Keil 自带 D:\keil5\ARM\Segger\JLink.exe）
#             先连一次，确认驱动/固件正常。
# ═══════════════════════════════════════════════════════════════════════════

# ── 调试器：SEGGER J-Link（SWD）────────────────────────────────────────────
source [find interface/jlink.cfg]
transport select swd

# ── 目标芯片：STM32F407IGH6 ───────────────────────────────────────────────
source [find target/stm32f4x.cfg]

# SWD 时钟（kHz）。J-Link 驱动能力强，4000 很稳；
# 杜邦线较长 / 干扰大时降到 1000，先保证连得上再提速。
adapter speed 4000

# ── 复位配置（按需启用）────────────────────────────────────────────────────
# 出现下面任一情况时，取消注释再试：
#   - "Error: RESET not supported"
#   - 下载成功但程序不跑（要按一下板子复位键才跑）
#   - 报 SRST 相关错误
#
# reset_config srst_only srst_nogate
