# ═══════════════════════════════════════════════════════════════════════════
#  RM_F407 烧录 / 调试配置（ST-Link）
#
#  用法（在工程根目录 D:\RM_XIAO\RM_F407 下）：
#    openocd -f User_Config/openocd_stlink.cfg ^
#            -c "program build/Debug/RM_F407.elf verify reset exit"
#
#  这里默认用 DAP direct 模式（接口驱动 st-link）：
#    - 支持 ST-Link V2-1（Nucleo 板载）和 ST-LINK-V3；
#    - ST-Link V2 独立小U盘需要固件 >= V2J24。
#
#  如果你的 ST-Link V2 是较老固件（V2J2x 以下）连不上，把下面两行换成：
#    source [find interface/stlink.cfg]
#    transport select hla_swd
#  这是老的 HLA 驱动，支持 V1 / V2 / V2-1，但不支持 V3。
#
#  前提：Windows 已安装 ST-Link 驱动（本机已装 stlink_dbg_winusb.inf）。
#        注意别同时开着 STM32CubeProgrammer / ST-Link Utility /
#        ST-LINK_gdbserver，它们会独占调试器。
# ═══════════════════════════════════════════════════════════════════════════

# ── 调试器：ST-Link（DAP direct / SWD）──────────────────────────────────────
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# ── 目标芯片：STM32F407IGH6 ───────────────────────────────────────────────
source [find target/stm32f4x.cfg]

# SWD 时钟（kHz）。ST-Link V2/V2-1 上限 4000，V3 可以更高；
# 这里按 V2 的上限取 4000，兼容性最好。
adapter speed 4000

# ── 复位配置（按需启用）────────────────────────────────────────────────────
# 出现 "Error: RESET not supported"、下载后不运行、或 SRST 报错时，
# 取消注释再试：
#
# reset_config srst_only srst_nogate
