# ═══════════════════════════════════════════════════════════════════════════
#  RM_F407 烧录 / 调试配置（C 板板载 DAPLink）
#
#  用法（在工程根目录 D:\RM_XIAO\RM_F407 下）：
#    openocd -f User_Config/openocd_daplink.cfg ^
#            -c "program build/Debug/RM_F407.elf verify reset exit"
#
#  配置依据：basic_framework 的 openocd_dap.cfg（那是 C 板原生工程，
#            用的就是 CMSIS-DAP / DAPLink）。这里是它的超集，
#            多加了 adapter speed 和几处排错开关。
# ═══════════════════════════════════════════════════════════════════════════

# ── 调试器：CMSIS-DAP（C 板板载 DAPLink）──────────────────────────────────
source [find interface/cmsis-dap.cfg]
transport select swd

# 如果 OpenOCD 报 "unable to find a matching CMSIS-DAP device"，
# 按顺序试这三招：
#   ① 换后端（有些 DAPLink 枚举成 HID 而不是 WinUSB）
#        cmsis_dap_backend hid
#   ② 显式指定 VID:PID（从设备管理器 → 详细信息 → 硬件 ID 读出来）
#        cmsis_dap_vid_pid 0x0d28 0x0204
#   ③ 用这条命令看 OpenOCD 到底枚举到了什么：
#        openocd -f interface/cmsis-dap.cfg -c "cmsis_dap_backend usb" -c "exit"

# ── 目标芯片：STM32F407IGH6 ───────────────────────────────────────────────
source [find target/stm32f4x.cfg]

# SWD 时钟。首次 bring-up 用 1MHz 最稳；跑通后可以提到 4000~8000 加快下载。
# 如果连不上，先降到 500 排除信号完整性问题。
adapter speed 1000

# ── 复位配置（这一项按需启用）────────────────────────────────────────────
# 默认不设，让 OpenOCD 用它自己的缺省值——basic_framework 的配置也没设。
#
# 如果出现下面任一情况，取消下面那行的注释再试：
#   - "Error: RESET not supported"
#   - 下载成功但程序不跑（要按一下板子复位键才跑）
#   - 报 SRST 相关错误
#
# reset_config srst_only srst_nogate
#
# 反之，如果加了这行之后报 SRST 错误，说明 C 板的 DAPLink 没接 NRST，
# 那就再注释掉，改用软件复位（OpenOCD 对 Cortex-M 会走 SYSRESETREQ）。
